name: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Linter
        run: go tool golangci-lint run

      - name: Verify tidy dependencies
        run: go mod tidy --diff >/dev/null || (echo 'go.mod/go.sum are not tidy' && exit 1)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test (race detector + randomized order)
        run: go test -v -race -shuffle=on ./...

      - name: CRAP gate
        run: make crap

      - name: Set up Cocogitto
        uses: cocogitto/cocogitto-action@v4
        with:
          command: --version

      - name: Test release version selection
        run: bash .github/scripts/test-release-tag.sh

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go build -o veronica ./cmd/veronica

  release:
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Cocogitto
        uses: cocogitto/cocogitto-action@v4
        with:
          command: --version

      # Pushes made with GITHUB_TOKEN cannot trigger another push workflow.
      - name: Tag tested commit and dispatch release
        run: |
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          if [[ $main_ref != "$GITHUB_SHA"$'\t'refs/heads/main ]]; then
            echo 'A newer commit is on main; skipping this release.'
            exit 0
          fi
          git fetch --tags origin
          tag=$(bash .github/scripts/release-tag.sh)
          git push origin "refs/tags/$tag"
          state=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$tag\" and (.draft | not)) | .tag_name")
          if [[ -n $state ]]; then
            echo "$tag is already published."
          else
            gh workflow run release.yml --ref "$tag"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
